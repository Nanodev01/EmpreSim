# Aplicación y backups. La aplicación se publica en el puerto 5111 del servidor.
# - En Coolify: no hace falta asignar un dominio; un túnel o proxy externo puede apuntar a IP:5111.
# - En un servidor propio: se puede sumar Caddy con docker-compose.caddy.yml (ver README).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: simulando-emprendedores:latest
    container_name: simulando-emprendedores
    restart: unless-stopped
    ports:
      - "5111:5111"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    volumes:
      - simulando_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Solo se usan al arrancar, para corregir el dueño del volumen y pasar al usuario sin privilegios.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: simulando-backup:latest
    container_name: simulando-backup
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      - BACKUP_INTERVALO_SEGUNDOS=${BACKUP_INTERVALO_SEGUNDOS:-21600}
      - BACKUP_RETENCION_DIAS=${BACKUP_RETENCION_DIAS:-14}
    volumes:
      - simulando_data:/data
      - simulando_backups:/backups

volumes:
  simulando_data:
  simulando_backups:
